name: Audit dependency lock remediation
on:
  push:
    branches:
      - audit/turma-black-2026-10-27-security
    paths:
      - .github/workflows/audit-dependency-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fix vulnerable dependencies in package lock without installing scripts
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Verify lock is installable
        run: npm ci --ignore-scripts --no-fund
      - name: Verify dependency security audit
        run: npm audit --audit-level=high
      - name: Commit only vetted dependency manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): refresh vulnerable dependency lock entries"
            git push origin HEAD:audit/turma-black-2026-10-27-security
          fi
