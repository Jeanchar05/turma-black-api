name: Validate Turma do Primo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies without project lifecycle scripts
        run: npm install --ignore-scripts --no-fund

      - name: Validate JavaScript syntax
        run: npm run validate

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Scan repository for committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' --exclude='.env.example' \
            '(BESTFY_API_KEY|JWT_SECRET|SETUP_SECRET|DB_PASSWORD)[[:space:]]*=[[:space:]]*[^$<{[:space:]]{12,}' .; then
            echo 'Possible committed secret detected.'
            exit 1
          fi
          echo 'No obvious committed environment secrets found.'
