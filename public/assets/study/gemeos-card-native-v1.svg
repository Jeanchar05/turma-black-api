<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Gêmeos</title><desc id="desc">Duas figuras espelhadas em roxo com símbolo de Gêmeos dourado.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050208"/><stop offset=".5" stop-color="#10051a"/><stop offset="1" stop-color="#030106"/></linearGradient>
  <radialGradient id="halo" cx="50%" cy="42%" r="55%"><stop stop-color="#7c19c8" stop-opacity=".48"/><stop offset="1" stop-color="#12041d" stop-opacity="0"/></radialGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1a5ff"/><stop offset=".28" stop-color="#be3cff"/><stop offset=".65" stop-color="#6515a8"/><stop offset="1" stop-color="#26043f"/></linearGradient>
