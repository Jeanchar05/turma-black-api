<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Roleta Reel — minigame exclusivo da Turma do Primo</title>
  <desc id="desc">Banner premium preto, roxo e dourado com roleta europeia.</desc>
  <defs>
    <radialGradient id="bg" cx="72%" cy="38%" r="82%"><stop stop-color="#371052"/><stop offset=".45" stop-color="#160621"/><stop offset="1" stop-color="#050208"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff2b8"/><stop offset=".38" stop-color="#f0c45a"/><stop offset=".72" stop-color="#9a5a1c"/><stop offset="1" stop-color="#f7da83"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".38" stop-color="#e5d8ea"/><stop offset=".72" stop-color="#9c7ba8"/><stop offset="1" stop-color="#f5e5f7"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".72"/></filter>
    <pattern id="stars" width="150" height="120" patternUnits="userSpaceOnUse"><circle cx="20" cy="22" r="2" fill="#cf79ff"/><circle cx="90" cy="74" r="1.5" fill="#f0c45a"/><circle cx="132" cy="24" r="1" fill="#fff"/></pattern>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#stars)" opacity=".48"/>
  <path d="M0 142C270 10 480 22 760 142" fill="none" stroke="#8f2bc5" stroke-width="5" opacity=".38"/>
  <path d="M1040 22C1320 42 1490 190 1600 322" fill="none" stroke="#8f2bc5" stroke-width="5" opacity=".4"/>

  <g transform="translate(105 78)">
    <rect width="80" height="94" rx="17" fill="#130719" stroke="#f0c45a" stroke-width="3"/>
    <path d="M22 15 31 30 47 25 55 42 70 48 60 66 20 66 10 48 25 41Z" fill="url(#gold)" opacity=".9"/>
    <text x="40" y="80" text-anchor="middle" font-family="Georgia" font-weight="700" font-size="49" fill="url(#gold)">P</text>
    <text x="105" y="38" font-family="Arial" font-size="19" letter-spacing="8" fill="#eadfe9">TURMA DO PRIMO</text>
    <text x="105" y="70" font-family="Arial" font-size="13" letter-spacing="5" fill="#c677ff">MINIGAME EXCLUSIVO</text>
