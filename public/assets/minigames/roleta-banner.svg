    <circle r="242" fill="#210b2c" stroke="url(#gold)" stroke-width="12"/>
    <g stroke="#d7a746" stroke-width="3">
      <path d="M0-236V-92"/><path transform="rotate(30)" d="M0-236V-92"/><path transform="rotate(60)" d="M0-236V-92"/><path transform="rotate(90)" d="M0-236V-92"/><path transform="rotate(120)" d="M0-236V-92"/><path transform="rotate(150)" d="M0-236V-92"/><path transform="rotate(180)" d="M0-236V-92"/><path transform="rotate(210)" d="M0-236V-92"/><path transform="rotate(240)" d="M0-236V-92"/><path transform="rotate(270)" d="M0-236V-92"/><path transform="rotate(300)" d="M0-236V-92"/><path transform="rotate(330)" d="M0-236V-92"/>
    </g>
    <circle r="172" fill="none" stroke="#742a38" stroke-width="48" stroke-dasharray="45 45"/>
    <circle r="122" fill="#08030d" stroke="#c79038" stroke-width="9"/>
