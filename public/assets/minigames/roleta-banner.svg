  <g transform="translate(120 650)" font-family="Arial">
    <rect width="760" height="70" rx="20" fill="#13071b" stroke="#8330ad" stroke-width="2"/>
    <text x="34" y="29" font-size="16" letter-spacing="4" fill="#f0c45a">LEITURA DE MESA</text><text x="34" y="52" font-size="15" fill="#b9adbf">Observe, confirme e decida.</text>
    <text x="278" y="29" font-size="16" letter-spacing="4" fill="#f0c45a">GESTÃO DE BANCA</text><text x="278" y="52" font-size="15" fill="#b9adbf">Defina limites e proteja o capital.</text>
    <text x="575" y="29" font-size="16" letter-spacing="4" fill="#f0c45a">CONTROLE</text><text x="575" y="52" font-size="15" fill="#b9adbf">Treine com clareza.</text>
