    <text x="0" y="116" font-family="Georgia" font-weight="700" font-size="154" letter-spacing="4" fill="url(#silver)" filter="url(#shadow)">ROLETA</text>
    <text x="7" y="170" font-size="24" letter-spacing="9" fill="#f0c45a">REEL</text>
    <text x="7" y="222" font-size="21" fill="#c8bbce">Treine suas estratégias, interprete cada giro</text>
    <text x="7" y="254" font-size="21" fill="#c8bbce">e evolua com inteligência, controle e disciplina.</text>
  </g>

